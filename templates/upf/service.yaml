{{- if .Values.upf.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "travelping-upf-loadtest.fullname" . }}-upf-pfcp
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "travelping-upf-loadtest.upf.labels" . | nindent 4 }}
    service: pfcp
spec:
  type: ClusterIP
  ports:
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
  selector:
    {{- include "travelping-upf-loadtest.upf.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "travelping-upf-loadtest.fullname" . }}-upf-gtpu
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "travelping-upf-loadtest.upf.labels" . | nindent 4 }}
    service: gtpu
spec:
  type: ClusterIP
  ports:
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
  selector:
    {{- include "travelping-upf-loadtest.upf.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "travelping-upf-loadtest.fullname" . }}-upf-cli
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "travelping-upf-loadtest.upf.labels" . | nindent 4 }}
    service: cli
spec:
  type: ClusterIP
  ports:
    - name: cli
      port: 5002
      targetPort: 5002
      protocol: TCP
  selector:
    {{- include "travelping-upf-loadtest.upf.selectorLabels" . | nindent 4 }}
{{- if and .Values.monitoring.enabled .Values.monitoring.vppExporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "travelping-upf-loadtest.fullname" . }}-upf-metrics
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "travelping-upf-loadtest.upf.labels" . | nindent 4 }}
    service: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.monitoring.vppExporter.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "travelping-upf-loadtest.upf.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
