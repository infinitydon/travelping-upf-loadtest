{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "travelping-upf-loadtest.fullname" . }}-prometheus-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "travelping-upf-loadtest.labels" . | nindent 4 }}
    prometheus: "config"
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'upf'
        static_configs:
          - targets: ['{{ include "travelping-upf-loadtest.fullname" . }}-upf:9090']
        metrics_path: /metrics

      - job_name: 'trex'
        static_configs:
          - targets: ['{{ include "travelping-upf-loadtest.fullname" . }}-trex-http:8086']
        metrics_path: /trex/metrics

      - job_name: 'pfcp-sim'
        static_configs:
          - targets: ['{{ include "travelping-upf-loadtest.fullname" . }}-pfcp-sim:9090']
        metrics_path: /metrics

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
{{- end }}
